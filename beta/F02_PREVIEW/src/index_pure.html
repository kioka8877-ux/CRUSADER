<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>F02 — CRUSADER Preview</title>
  <script>
    (function(){try{if(localStorage.getItem('theme')==='light'){document.documentElement.classList.remove('dark')}else if(!localStorage.getItem('theme')&&!window.matchMedia('(prefers-color-scheme: dark)').matches){document.documentElement.classList.remove('dark')}}catch(e){}})();
  </script>
  <script src="https://cdn.tailwindcss.com/3.4.16"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{}}}</script>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-gray-950 text-gray-100 min-h-screen">
  <div id="app" class="flex flex-col h-screen">
    <!-- Header -->
    <header class="px-4 py-3 border-b border-gray-800 flex items-center justify-between shrink-0">
      <h1 class="text-lg font-bold">🎬 F02 — CRUSADER Preview</h1>
      <div class="flex gap-2">
        <button id="btnExport" class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 rounded text-sm font-semibold">📥 Export roadmap.json</button>
      </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
      <!-- Controls -->
      <aside id="controls" class="w-72 border-r border-gray-800 overflow-y-auto p-3 shrink-0 text-sm"></aside>

      <!-- Preview -->
      <main class="flex-1 overflow-y-auto p-4 flex flex-col gap-6">
        <!-- Timeline -->
        <div class="flex items-center gap-3 shrink-0">
          <button id="btnPlay" class="px-3 py-1 bg-gray-800 rounded hover:bg-gray-700 text-xs">▶ Play</button>
          <input id="timeline" type="range" min="0" max="100" value="0" class="flex-1 accent-amber-500" />
          <span id="frameLabel" class="text-xs font-mono text-gray-400 w-28 text-right">Frame 0 / 0</span>
        </div>

        <!-- Desktop viewport -->
        <div class="flex flex-col items-center gap-1">
          <span class="text-xs text-gray-500 font-mono">Desktop — 1920×1080</span>
          <div id="viewport-desktop" class="border-2 border-gray-700 rounded-xl overflow-hidden bg-black shadow-2xl w-full" style="aspect-ratio:16/9; position:relative;"></div>
        </div>

        <!-- iPhone viewport -->
        <div class="flex flex-col items-center gap-1">
          <span class="text-xs text-gray-500 font-mono">iPhone 16 Pro Max</span>
          <div id="viewport-iphone" class="border-2 border-gray-700 rounded-xl overflow-hidden bg-black shadow-2xl mx-auto" style="aspect-ratio:9/19.5; width:220px; position:relative;"></div>
        </div>
      </main>
    </div>
  </div>
  <script src="app.js"></script>
</body>
</html>
