    <div style="display:flex;gap:4px;margin-bottom:4px;">
      <button class="btn-small" style="flex:1;font-size:10px;padding:4px;" onclick="runTransPreview(8)">8f</button>
      <button class="btn-small" style="flex:1;font-size:10px;padding:4px;" onclick="runTransPreview(12)">12f</button>
      <button class="btn-small" style="flex:1;font-size:10px;padding:4px;" onclick="runTransPreview(18)">18f</button>
      <button class="btn-small" style="flex:1;font-size:10px;padding:4px;" onclick="runTransPreview(30)">30f</button>
    </div>
    <button class="btn-small" onclick="runTransPreview(lastTransFrames||12)" style="width:100%;font-size:10px;">▶ Rejouer</button>

    ${section("🧍 Personnage")}
    ${slider("character_scale", "Taille personnage", 0.5, 5, 0.1)}
    ${slider("transition_duration", "Transition (s)", 0, 3, 0.1)}

    ${section("🎬 Production")}
    ${textInput("production_title", "Titre production")}

    ${section("🎨 Effets")}
    ${slider("grain_intensity", "Grain", 0, 1, 0.01)}
    ${checkbox("vignette", "Vignetage activé")}
  `;

  bindControlEvents();
}


// ─── Control builder helpers ───
function section(t) { return `<div class="section-title">${t}</div>`; }

function slider(key, label, min, max, step) {
  const v = getS(key);
  return `<div class="ctrl-row"><label><span>${label}</span><span class="val">${v}</span></label><input type="range" data-key="${key}" min="${min}" max="${max}" step="${step}" value="${v}"></div>`;
}

function selectCtrl(key, label, values, labels) {
  const v = getS(key);
  const opts = values.map((val, i) => `<option value="${val}" ${String(val)===String(v)?"selected":""}>${labels[i]}</option>`).join('');
  return `<div class="ctrl-row"><label>${label}</label><select data-key="${key}">${opts}</select></div>`;
}

function fontSelect(key, label) {
  const v = getS(key);
  const otherKey = key + '_other';
  const isOther = !FONTS.includes(v) && v !== '';
  const opts = FONTS_WITH_OTHER.map((f, i) => {
    const selected = (f === v || (f === '__other__' && isOther)) ? 'selected' : '';
    return `<option value="${f}" ${selected}>${FONT_LABELS[i]}</option>`;
  }).join('');
  const showOther = isOther || v === '__other__' ? '' : 'display:none;';
  return `<div class="ctrl-row">
    <label>${label}</label>
    <select data-key="${key}" data-font="true" onchange="onFontChange('${key}','${otherKey}',this)">${opts}</select>
    <input type="text" data-key="${otherKey}" value="${isOther ? v : ''}" placeholder="Nom exact de la police…" 
      style="${showOther}margin-top:3px;background:#1A1A1A;border:1px solid var(--gold-dim);border-radius:var(--radius);padding:3px 6px;font-size:11px;color:var(--bone);font-family:var(--mono);width:100%;"
      oninput="setS('${key}', this.value)">
  </div>`;
}

function onFontChange(key, otherKey, selectEl) {
  const val = selectEl.value;
  const otherInput = selectEl.parentElement.querySelector(`input[data-key="${otherKey}"]`);
  if (val === '__other__') {
    otherInput.style.display = '';
    otherInput.focus();
  } else {
    otherInput.style.display = 'none';
    setS(key, val);
  }
}

function colorCtrl(key, label) {
  const v = getS(key);
  return `<div class="ctrl-row" style="display:flex;align-items:center;gap:8px"><input type="color" data-key="${key}" value="${v}"><label style="flex:1">${label}</label><span class="val" style="font-size:10px">${v}</span></div>`;
}

function checkbox(key, label) {
  const v = getS(key);
  return `<div class="ctrl-row"><label style="gap:8px;cursor:pointer;display:flex;align-items:center"><input type="checkbox" data-key="${key}" ${v?"checked":""}> ${label}</label></div>`;
}

function textInput(key, label) {
  const v = getS(key);
  return `<div class="ctrl-row"><label>${label}</label><input type="text" data-key="${key}" value="${v||''}" style="width:100%;margin-top:2px;background:#1A1A1A;border:1px solid var(--gold-dim);border-radius:var(--radius);padding:3px 6px;font-size:11px;color:var(--bone);font-family:var(--mono);"></div>`;
}

function radioGroup(key, options) {
  const v = getS(key);
  return `<div class="ctrl-row" style="display:flex;gap:6px">${options.map(o => `
    <label style="flex:1;display:flex;align-items:center;gap:4px;padding:6px 8px;background:${o.value===v?'var(--gold-glow)':'#1A1A1A'};border:1px solid ${o.value===v?'var(--gold-dim)':'var(--border)'};border-radius:var(--radius);cursor:pointer;font-size:10px;color:${o.value===v?'var(--gold)':'var(--bone)'}">
      <input type="radio" name="${key}" value="${o.value}" ${o.value===v?"checked":""} style="accent-color:var(--gold)"> ${o.label}
    </label>`).join('')}</div>`;
}

function positionButtons(key, label) {
  const v = getS(key);
  return `<div class="ctrl-row">
    <label style="margin-bottom:4px">${label}</label>
    <div style="display:flex;gap:6px;">
      ${['top','center','bottom'].map(pos => {
        const active = pos === v;
        const barPos = pos === 'top' ? 'top:4px' : pos === 'center' ? 'top:50%;transform:translateY(-50%)' : 'bottom:4px';
        const lbl = pos === 'top' ? 'Haut' : pos === 'center' ? 'Centre' : 'Bas';
        return `<button class="btn-small" style="flex:1;padding:4px;${active?'border-color:var(--gold);color:var(--gold);background:var(--gold-glow)':''}" 
          onclick="setS('${key}','${pos}');buildControls()">
          <div style="position:relative;width:100%;height:28px;background:#111;border-radius:2px;margin-bottom:2px;">
            <div style="position:absolute;left:15%;right:15%;height:4px;background:${active?'var(--gold)':'#555'};border-radius:1px;${barPos}"></div>
          </div>
          <span style="font-size:9px">${lbl}</span>
        </button>`;
      }).join('')}
    </div>
  </div>`;
}

// ─── Transition preview animation ───
let lastTransFrames = 12;
function runTransPreview(frames) {
  lastTransFrames = frames;
  setS('transition_frames', frames);
  const n = document.getElementById('tp-n');
  const n1 = document.getElementById('tp-n1');
  const arrow = document.getElementById('tp-arrow');

  // Reset
  n.style.transition = 'none';
  n1.style.transition = 'none';
  arrow.style.transition = 'none';
  n.style.opacity = '1'; n.style.transform = 'scale(1)';
  n1.style.opacity = '0.3'; n1.style.transform = 'scale(0.5)';
  arrow.style.transform = 'scaleX(0)'; arrow.style.opacity = '0';

  requestAnimationFrame(() => {
    const dur = (frames / 30).toFixed(2) + 's';
    n.style.transition = `all ${dur} ease-in-out`;
    n1.style.transition = `all ${dur} ease-in-out`;
    arrow.style.transition = `all ${dur} ease-in-out`;

    requestAnimationFrame(() => {
      n.style.opacity = '0.3'; n.style.transform = 'scale(0.5)';
      n1.style.opacity = '1'; n1.style.transform = 'scale(1)';
      arrow.style.transform = 'scaleX(1)'; arrow.style.opacity = '1';
    });
  });
}

// ─── Bind all control events ───
function bindControlEvents() {
  const c = document.getElementById('controls');
  c.querySelectorAll('input[type=range]').forEach(el => {
    el.addEventListener('input', () => {
      const v = parseFloat(el.value);
      setS(el.dataset.key, v);
      const valEl = el.closest('.ctrl-row').querySelector('.val');
      if (valEl) valEl.textContent = v;
      if (el.dataset.key === 'character_scale') rebuildCharacters();
    });
  });
  c.querySelectorAll('select:not([data-font])').forEach(el => {
    el.addEventListener('change', () => {
      setS(el.dataset.key, el.value);
      if (el.dataset.key === 'background_type') drawBgTextures();
    });
  });
  c.querySelectorAll('select[data-font]').forEach(el => {
    // Handled by onFontChange inline
  });
  c.querySelectorAll('input[type=checkbox]').forEach(el => {
    el.addEventListener('change', () => setS(el.dataset.key, el.checked));
  });
  c.querySelectorAll('input[type=color]').forEach(el => {
    el.addEventListener('input', () => {
      setS(el.dataset.key, el.value);
      const valEl = el.closest('.ctrl-row').querySelector('.val');
      if (valEl) valEl.textContent = el.value;
    });
  });
  c.querySelectorAll('input[type=text]').forEach(el => {
    if (el.dataset.key && !el.dataset.key.endsWith('_other')) {
      el.addEventListener('input', () => setS(el.dataset.key, el.value));
    }
  });
  c.querySelectorAll('input[name=format]').forEach(el => {
    el.addEventListener('change', () => {
      setS('format', el.value);
      updateCanvasFormat();
    });
  });
}

// ════════════════════════════════════════════════════
// SCENE LIST + EDITOR
// ════════════════════════════════════════════════════

function buildSceneList() {
  const container = document.getElementById('sceneList');
  const bgEmoji = { nature:'🌿', city:'🌃', office:'🏢', abstract:'✨' };
  container.innerHTML = storyboard.scenes.map((scene, i) => `
    <div class="scene-item ${i===currentSceneIndex?'active':''}" onclick="goToScene(${i})">
      <span class="snum">${i+1}</span>
      <span class="sname">${bgEmoji[scene.background]||'🎬'} ${scene.name}</span>
      <span class="sdur">${scene.duration}s</span>
    </div>
  `).join('');
}

function loadSceneEditor() {
  const scene = storyboard.scenes[currentSceneIndex];
  const ed = document.getElementById('sceneEditor');
  ed.innerHTML = `
    <div class="scene-field">
      <label>Nom</label>
      <input type="text" value="${scene.name||''}" onchange="updateSceneField('name', this.value)"/>
    </div>
    <div class="field-row">
      <div class="scene-field">
        <label>Durée (s)</label>
        <input type="number" value="${scene.duration}" min="0.5" max="60" step="0.5" onchange="updateSceneField('duration', parseFloat(this.value))"/>
      </div>
      <div class="scene-field">
        <label>Décor</label>
        <select onchange="updateSceneField('background', this.value)">
          <option value="nature" ${scene.background==='nature'?'selected':''}>🌿 Nature</option>
          <option value="city" ${scene.background==='city'?'selected':''}>🌃 Ville</option>
          <option value="office" ${scene.background==='office'?'selected':''}>🏢 Bureau</option>
          <option value="abstract" ${scene.background==='abstract'?'selected':''}>✨ Abstrait</option>
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="scene-field">
        <label>Posture</label>
        <select onchange="updateCharField('posture', this.value)">
          ${['idle','walk','talk','gesture','sit'].map(p => `<option value="${p}" ${scene.character.posture===p?'selected':''}>${p}</option>`).join('')}
        </select>
      </div>
      <div class="scene-field">
        <label>Émotion</label>
        <select onchange="updateCharField('emotion', this.value)">
          ${['neutral','happy','sad','angry','surprised','thinking'].map(e => `<option value="${e}" ${scene.character.emotion===e?'selected':''}>${e}</option>`).join('')}
        </select>
      </div>
    </div>
    <div class="field-row">
      <div class="scene-field">
        <label>Direction</label>
        <select onchange="updateCharField('direction', parseInt(this.value))">
          <option value="1" ${scene.character.direction===1?'selected':''}>→ Droite</option>
          <option value="-1" ${scene.character.direction===-1?'selected':''}>← Gauche</option>
        </select>
      </div>
      <div class="scene-field">
        <label>Y ratio</label>
        <input type="number" value="${scene.character.y_ratio}" min="0.2" max="0.95" step="0.02" onchange="updateCharField('y_ratio', parseFloat(this.value))"/>
      </div>
    </div>
    <div class="field-row">
      <div class="scene-field">
        <label>Start X</label>
        <input type="number" value="${scene.character.start_x}" min="0" max="1920" step="10" onchange="updateCharField('start_x', parseInt(this.value))"/>
      </div>
      <div class="scene-field">
        <label>End X</label>
        <input type="number" value="${scene.character.end_x}" min="0" max="1920" step="10" onchange="updateCharField('end_x', parseInt(this.value))"/>
      </div>
    </div>
    <div class="scene-field">
      <label>Particules</label>
      <select onchange="updateEffectField('particles', this.value || null)">
        <option value="" ${!scene.effects?.particles?'selected':''}>Aucune</option>
        <option value="dust" ${scene.effects?.particles==='dust'?'selected':''}>Poussière</option>
        <option value="rain" ${scene.effects?.particles==='rain'?'selected':''}>Pluie</option>
        <option value="snow" ${scene.effects?.particles==='snow'?'selected':''}>Neige</option>
        <option value="sparks" ${scene.effects?.particles==='sparks'?'selected':''}>Étincelles</option>
      </select>
    </div>
    <div class="scene-field">
      <label>Titre de scène</label>
      <input type="text" value="${scene.world_title||''}" onchange="updateSceneField('world_title', this.value)"/>
    </div>
    <div class="scene-field">
      <label>Sous-titre <span style="color:var(--text-dim);font-size:9px">(**mot** = accent)</span></label>
      <textarea rows="2" onchange="updateSceneField('text', this.value)">${scene.text||''}</textarea>
    </div>
  `;
  updateFooterInfo();
}

function updateSceneField(field, value) {
  storyboard.scenes[currentSceneIndex][field] = value;
  if (field === 'background') Object.keys(bgInstances).forEach(k => delete bgInstances[k]);
  buildSceneList();
  updateFooterInfo();
}
function updateCharField(field, value) { storyboard.scenes[currentSceneIndex].character[field] = value; }
function updateEffectField(field, value) {
  if (!storyboard.scenes[currentSceneIndex].effects) storyboard.scenes[currentSceneIndex].effects = {};
  storyboard.scenes[currentSceneIndex].effects[field] = value || null;
  Object.keys(particleInstances).forEach(k => delete particleInstances[k]);
}

function addScene() {
  const n = storyboard.scenes.length + 1;
  storyboard.scenes.push({
    id: 'scene_' + String(n).padStart(2,'0'),
    name: 'Nouvelle scène', duration: 3.0, background: 'nature',
    character: { posture:'idle', emotion:'neutral', direction:1, start_x:960, end_x:960, y_ratio:0.72 },
    effects: { particles:null, vignette:true }, text: '', world_title: 'Nouvelle scène',
  });
  currentSceneIndex = storyboard.scenes.length - 1;
  buildSceneList(); loadSceneEditor(); showToast('Scène ajoutée ✅');
}

function deleteScene() {
  if (storyboard.scenes.length <= 1) { showToast('Au moins 1 scène requise'); return; }
  storyboard.scenes.splice(currentSceneIndex, 1);
  if (currentSceneIndex >= storyboard.scenes.length) currentSceneIndex--;
  buildSceneList(); loadSceneEditor(); showToast('Scène supprimée');
}

function updateFooterInfo() {
  const totalDur = storyboard.scenes.reduce((s, sc) => s + sc.duration, 0);
  const fps = storyboard.global?.fps || 30;
  document.getElementById('progressInfo').textContent = 
    `${storyboard.scenes.length} scènes · ${totalDur.toFixed(1)}s · ${Math.ceil(totalDur * fps)} frames @ ${fps}fps`;
}

// ════════════════════════════════════════════════════
// IMPORT / EXPORT
// ════════════════════════════════════════════════════

function exportStoryboard() {
  const merged = JSON.parse(JSON.stringify(storyboard));
  Object.keys(styleOverrides).forEach(k => { merged.global[k] = styleOverrides[k]; });
  const json = JSON.stringify(merged, null, 2);
  const blob = new Blob([json], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = 'storyboard.json'; a.click();
  URL.revokeObjectURL(url);
  showToast('⚔ storyboard.json exporté');
}

function importStoryboard() { document.getElementById('fileInput').click(); }
function handleImport(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      storyboard = JSON.parse(e.target.result);
      styleOverrides = {};
      currentSceneIndex = 0;
      Object.keys(bgInstances).forEach(k => delete bgInstances[k]);
      Object.keys(particleInstances).forEach(k => delete particleInstances[k]);
      rebuildCharacters();
      buildControls(); buildSceneList(); loadSceneEditor();
      showToast('Storyboard importé ✅');
    } catch (err) { showToast('Erreur JSON: ' + err.message); }
  };
  reader.readAsText(file);
  event.target.value = '';
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ════════════════════════════════════════════════════
// INIT
// ════════════════════════════════════════════════════
buildControls();
buildSceneList();
loadSceneEditor();
renderLoop();

</script>
