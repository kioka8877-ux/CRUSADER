<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>CRUSADER Delta — F03B Scriptorium Output</title>
  <style>
    * { margin: 0; padding: 0; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
  </style>
</head>
<body>
  <canvas id="canvas" width="1920" height="1080"></canvas>

  <script>
// ═══════════════════════════════════════════════════
// INLINED: characters.js
// ═══════════════════════════════════════════════════
/**
 * CRUSADER Delta — F03A L'INTERPRÉTEUR
 * characters.js
 *
 * Personnage paramétrique Canvas 2D avec :
 * - Corps articulé (tête, torse, bras, jambes avec articulations)
 * - Système de postures (idle, walk, talk, gesture, sit)
 * - Émotions faciales (neutral, happy, sad, angry, surprised, thinking)
 * - 12 principes d'animation Disney intégrés
 *
 * Usage:
 *   const char = new CrusaderCharacter(ctx, { scale: 1, palette: {...} });
 *   char.setState('walk', 'happy');
 *   char.draw(x, y, time);
 */

class CrusaderCharacter {
  constructor(ctx, options = {}) {
    this.ctx = ctx;
    this.scale = options.scale || 1;
    this.palette = {
      skin: options.palette?.skin || '#F4C280',
      outline: options.palette?.outline || '#2C3E50',
      hair: options.palette?.hair || '#34495E',
      shirt: options.palette?.shirt || '#3498DB',
      pants: options.palette?.pants || '#2C3E50',
      shoes: options.palette?.shoes || '#1A1A2E',
      eye: options.palette?.eye || '#FFFFFF',
      pupil: options.palette?.pupil || '#2C3E50',
      mouth: options.palette?.mouth || '#C0392B',
      ...options.palette,
    };
    this.lineWidth = options.lineWidth || 3;
    this.posture = 'idle';
    this.emotion = 'neutral';
    this.direction = 1; // 1 = right, -1 = left
    this.transitionProgress = 1;
    this.prevPosture = 'idle';
  }

  setState(posture, emotion, direction) {
    if (posture && posture !== this.posture) {
      this.prevPosture = this.posture;
      this.posture = posture;
      this.transitionProgress = 0;
    }
    if (emotion) this.emotion = emotion;
    if (direction !== undefined) this.direction = direction;
  }

  // ─── 12 PRINCIPLES HELPERS ───────────────────────

  /** Principle 1: Squash & Stretch */
  _squashStretch(t, intensity = 0.08) {
    const s = Math.sin(t * 3) * intensity;
    return { sx: 1 - s, sy: 1 + s };
  }

  /** Principle 2: Anticipation — wind-up before action */
  _anticipation(t, phase, amount = 0.05) {
    if (phase < 0.15) return -amount * Math.sin((phase / 0.15) * Math.PI);
    return 0;
  }

  /** Principle 5: Follow-through & overlapping — delayed secondary motion */
  _followThrough(t, delay = 0.3) {
    return Math.sin((t - delay) * 2);
  }

  /** Principle 6: Slow in / Slow out — ease curve */
  _easeInOut(t) {
    return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;
  }

  /** Principle 7: Arcs — natural arc motion */
  _arc(t, radius = 5) {
    return Math.sin(t) * radius;
  }

  /** Principle 9: Timing — variable speed cycles */
  _timing(t, speed = 1) {
    return t * speed;
  }

  /** Principle 10: Exaggeration */
  _exaggerate(value, factor = 1.3) {
    return value * factor;
  }

  // ─── BODY SKELETON ──────────────────────────────

  _getSkeleton(time, posture) {
    const t = time;
    const s = this.scale;

    // Base skeleton (idle standing)
    const skeleton = {
      head: { x: 0, y: -70 * s, radius: 18 * s },
      neck: { x: 0, y: -52 * s },
      shoulderL: { x: -18 * s, y: -48 * s },
      shoulderR: { x: 18 * s, y: -48 * s },
      elbowL: { x: -28 * s, y: -28 * s },
      elbowR: { x: 28 * s, y: -28 * s },
      handL: { x: -30 * s, y: -8 * s },
      handR: { x: 30 * s, y: -8 * s },
      hip: { x: 0, y: -8 * s },
      hipL: { x: -10 * s, y: -6 * s },
      hipR: { x: 10 * s, y: -6 * s },
      kneeL: { x: -12 * s, y: 22 * s },
      kneeR: { x: 12 * s, y: 22 * s },
      footL: { x: -14 * s, y: 48 * s },
      footR: { x: 14 * s, y: 48 * s },
      torsoTop: { x: 0, y: -48 * s },
      torsoBottom: { x: 0, y: -8 * s },
    };

    // Apply posture-specific deformations
    switch (posture) {
      case 'walk':
        this._applyWalk(skeleton, t, s);
        break;
      case 'talk':
        this._applyTalk(skeleton, t, s);
        break;
      case 'gesture':
        this._applyGesture(skeleton, t, s);
        break;
      case 'sit':
        this._applySit(skeleton, t, s);
        break;
      case 'idle':
      default:
        this._applyIdle(skeleton, t, s);
        break;
    }

    return skeleton;
  }

  _applyIdle(sk, t, s) {
    // Principle 8: Secondary action — subtle breathing
    const breathe = Math.sin(t * 1.5) * 2 * s;
    sk.head.y += breathe * 0.5;
    sk.shoulderL.y += breathe * 0.3;
    sk.shoulderR.y += breathe * 0.3;
    sk.neck.y += breathe * 0.4;
    sk.torsoTop.y += breathe * 0.3;

    // Subtle arm sway
    sk.handL.x += Math.sin(t * 0.8) * 3 * s;
    sk.handR.x -= Math.sin(t * 0.8 + 0.5) * 3 * s;
    sk.elbowL.x += Math.sin(t * 0.8) * 1.5 * s;
    sk.elbowR.x -= Math.sin(t * 0.8 + 0.5) * 1.5 * s;
  }

  _applyWalk(sk, t, s) {
    const cycle = t * 3; // walk speed
    const stride = Math.sin(cycle) * 15 * s;
    const bounce = Math.abs(Math.sin(cycle)) * 4 * s;

    // Principle 1: Squash & stretch on bounce
    const { sy } = this._squashStretch(cycle, 0.03);

    // Legs — alternating stride
    sk.footL.x = -14 * s + stride;
    sk.footR.x = 14 * s - stride;
    sk.kneeL.x = -12 * s + stride * 0.5;
    sk.kneeR.x = 12 * s - stride * 0.5;
    sk.kneeL.y = 22 * s - Math.abs(Math.sin(cycle)) * 8 * s;
    sk.kneeR.y = 22 * s - Math.abs(Math.sin(cycle + Math.PI)) * 8 * s;
    sk.footL.y = 48 * s - Math.max(0, Math.sin(cycle)) * 12 * s;
    sk.footR.y = 48 * s - Math.max(0, Math.sin(cycle + Math.PI)) * 12 * s;

    // Body bounce
    sk.head.y -= bounce * sy;
    sk.neck.y -= bounce * 0.8;
    sk.torsoTop.y -= bounce * 0.7;
    sk.hip.y -= bounce * 0.3;

    // Principle 7: Arcs — arms swing in arcs
    sk.handL.x = -30 * s - stride * 0.6;
    sk.handR.x = 30 * s + stride * 0.6;
    sk.handL.y = -8 * s + this._arc(cycle, 5 * s);
    sk.handR.y = -8 * s + this._arc(cycle + Math.PI, 5 * s);
    sk.elbowL.x = -28 * s - stride * 0.3;
    sk.elbowR.x = 28 * s + stride * 0.3;

    // Principle 5: Follow-through — head lags slightly
    sk.head.x = Math.sin(cycle - 0.3) * 2 * s;
  }

  _applyTalk(sk, t, s) {
    this._applyIdle(sk, t, s);

    // Principle 8: Secondary action — hand gestures while talking
    const talkCycle = t * 4;
    sk.handR.x = 30 * s + Math.sin(talkCycle) * 10 * s;
    sk.handR.y = -25 * s + Math.sin(talkCycle * 1.3) * 8 * s;
    sk.elbowR.x = 28 * s + Math.sin(talkCycle) * 5 * s;
    sk.elbowR.y = -35 * s + Math.sin(talkCycle * 0.7) * 4 * s;
  }

  _applyGesture(sk, t, s) {
    this._applyIdle(sk, t, s);

    // Both arms up in expressive gesture
    const gestCycle = t * 2;
    const raise = this._easeInOut((Math.sin(gestCycle) + 1) / 2);

    sk.handL.x = -35 * s - raise * 10 * s;
    sk.handL.y = -40 * s - raise * 25 * s;
    sk.handR.x = 35 * s + raise * 10 * s;
    sk.handR.y = -40 * s - raise * 25 * s;
    sk.elbowL.x = -30 * s - raise * 5 * s;
    sk.elbowL.y = -40 * s - raise * 10 * s;
    sk.elbowR.x = 30 * s + raise * 5 * s;
    sk.elbowR.y = -40 * s - raise * 10 * s;

    // Slight body lean
    sk.head.y -= raise * 3 * s;
  }

  _applySit(sk, t, s) {
    // Seated posture
    sk.hip.y = 10 * s;
    sk.hipL.y = 12 * s;
    sk.hipR.y = 12 * s;
    sk.kneeL = { x: -20 * s, y: 15 * s };
    sk.kneeR = { x: 20 * s, y: 15 * s };
    sk.footL = { x: -22 * s, y: 40 * s };
    sk.footR = { x: 22 * s, y: 40 * s };
    sk.torsoBottom.y = 10 * s;

    // Breathing
    const breathe = Math.sin(t * 1.5) * 1.5 * s;
    sk.head.y += breathe * 0.3;
    sk.shoulderL.y += breathe * 0.2;
    sk.shoulderR.y += breathe * 0.2;
  }

  // ─── FACE / EMOTION ─────────────────────────────

  _drawFace(x, y, radius, time) {
    const ctx = this.ctx;
    const r = radius;
    const p = this.palette;

    // Head circle
    ctx.fillStyle = p.skin;
    ctx.strokeStyle = p.outline;
    ctx.lineWidth = this.lineWidth;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Hair (top of head)
    ctx.fillStyle = p.hair;
    ctx.beginPath();
    ctx.arc(x, y - r * 0.15, r * 1.05, Math.PI, Math.PI * 2);
    ctx.fill();

    // Eyes
    const eyeSpacing = r * 0.35;
    const eyeY = y - r * 0.1;
    const eyeR = r * 0.18;
    const pupilR = r * 0.09;

    // Eye whites
    ctx.fillStyle = p.eye;
    ctx.beginPath();
    ctx.ellipse(x - eyeSpacing, eyeY, eyeR, eyeR * 1.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = p.outline;
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.beginPath();
    ctx.ellipse(x + eyeSpacing, eyeY, eyeR, eyeR * 1.1, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.stroke();

    // Pupils — with subtle look direction
    const lookX = Math.sin(time * 0.5) * pupilR * 0.3;
    ctx.fillStyle = p.pupil;
    ctx.beginPath();
    ctx.arc(x - eyeSpacing + lookX, eyeY, pupilR, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(x + eyeSpacing + lookX, eyeY, pupilR, 0, Math.PI * 2);
    ctx.fill();

    // Emotion-specific features
    this._drawEmotion(x, y, r, time);
  }

  _drawEmotion(x, y, r, time) {
    const ctx = this.ctx;
    const mouthY = y + r * 0.35;
    const mouthW = r * 0.4;
    const eyeY = y - r * 0.1;
    const eyeSpacing = r * 0.35;
    const browY = y - r * 0.32;

    ctx.strokeStyle = this.palette.outline;
    ctx.lineWidth = 2;
    ctx.lineCap = 'round';

    switch (this.emotion) {
      case 'happy':
        // Smile
        ctx.beginPath();
        ctx.arc(x, mouthY - r * 0.05, mouthW, 0.1 * Math.PI, 0.9 * Math.PI);
        ctx.stroke();
        // Raised eyebrows
        ctx.beginPath();
        ctx.arc(x - eyeSpacing, browY + 2, r * 0.2, Math.PI * 1.2, Math.PI * 1.8);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + eyeSpacing, browY + 2, r * 0.2, Math.PI * 1.2, Math.PI * 1.8);
        ctx.stroke();
        // Blush
        ctx.fillStyle = 'rgba(255, 150, 150, 0.3)';
        ctx.beginPath();
        ctx.ellipse(x - eyeSpacing - 2, mouthY - r * 0.15, r * 0.15, r * 0.08, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.ellipse(x + eyeSpacing + 2, mouthY - r * 0.15, r * 0.15, r * 0.08, 0, 0, Math.PI * 2);
        ctx.fill();
        break;

      case 'sad':
        // Frown
        ctx.beginPath();
        ctx.arc(x, mouthY + r * 0.15, mouthW * 0.7, Math.PI * 1.2, Math.PI * 1.8);
        ctx.stroke();
        // Droopy eyebrows
        ctx.beginPath();
        ctx.moveTo(x - eyeSpacing - r * 0.15, browY - 2);
        ctx.lineTo(x - eyeSpacing + r * 0.15, browY + 3);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + eyeSpacing + r * 0.15, browY - 2);
        ctx.lineTo(x + eyeSpacing - r * 0.15, browY + 3);
        ctx.stroke();
        break;

      case 'angry':
        // Tight mouth
        ctx.beginPath();
        ctx.moveTo(x - mouthW * 0.5, mouthY);
        ctx.lineTo(x + mouthW * 0.5, mouthY);
        ctx.stroke();
        // Angry V eyebrows
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.moveTo(x - eyeSpacing - r * 0.18, browY - 4);
        ctx.lineTo(x - eyeSpacing + r * 0.1, browY + 2);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + eyeSpacing + r * 0.18, browY - 4);
        ctx.lineTo(x + eyeSpacing - r * 0.1, browY + 2);
        ctx.stroke();
        break;

      case 'surprised':
        // O mouth
        ctx.fillStyle = this.palette.mouth;
        ctx.beginPath();
        ctx.ellipse(x, mouthY, mouthW * 0.35, mouthW * 0.45, 0, 0, Math.PI * 2);
        ctx.fill();
        ctx.stroke();
        // Raised eyebrows (high)
        ctx.beginPath();
        ctx.arc(x - eyeSpacing, browY - 4, r * 0.2, Math.PI * 1.2, Math.PI * 1.8);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + eyeSpacing, browY - 4, r * 0.2, Math.PI * 1.2, Math.PI * 1.8);
        ctx.stroke();
        break;

      case 'thinking':
        // Side mouth
        ctx.beginPath();
        ctx.moveTo(x + mouthW * 0.1, mouthY);
        ctx.quadraticCurveTo(x + mouthW * 0.4, mouthY - 3, x + mouthW * 0.5, mouthY + 2);
        ctx.stroke();
        // One raised eyebrow
        ctx.beginPath();
        ctx.arc(x - eyeSpacing, browY, r * 0.2, Math.PI * 1.2, Math.PI * 1.8);
        ctx.stroke();
        ctx.beginPath();
        ctx.arc(x + eyeSpacing, browY - 5, r * 0.2, Math.PI * 1.15, Math.PI * 1.85);
        ctx.stroke();
        break;

      case 'neutral':
      default:
        // Simple line mouth
        ctx.beginPath();
        ctx.moveTo(x - mouthW * 0.4, mouthY);
        ctx.quadraticCurveTo(x, mouthY + 2, x + mouthW * 0.4, mouthY);
        ctx.stroke();
        // Flat eyebrows
        ctx.beginPath();
        ctx.moveTo(x - eyeSpacing - r * 0.15, browY);
        ctx.lineTo(x - eyeSpacing + r * 0.15, browY);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(x + eyeSpacing - r * 0.15, browY);
        ctx.lineTo(x + eyeSpacing + r * 0.15, browY);
        ctx.stroke();
        break;
    }
  }

  // ─── BODY DRAWING ───────────────────────────────

  _drawLimb(from, to, width, color) {
    const ctx = this.ctx;
    ctx.strokeStyle = color || this.palette.outline;
    ctx.lineWidth = width || this.lineWidth * 1.5;
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';
    ctx.beginPath();
    ctx.moveTo(from.x, from.y);
    ctx.lineTo(to.x, to.y);
    ctx.stroke();
  }

  _drawBody(sk) {
    const ctx = this.ctx;
    const p = this.palette;

    // Torso — filled shape
    ctx.fillStyle = p.shirt;
    ctx.strokeStyle = p.outline;
    ctx.lineWidth = this.lineWidth;
    ctx.beginPath();
    ctx.moveTo(sk.shoulderL.x, sk.shoulderL.y);
    ctx.lineTo(sk.shoulderR.x, sk.shoulderR.y);
    ctx.lineTo(sk.hipR.x + 2, sk.torsoBottom.y);
    ctx.lineTo(sk.hipL.x - 2, sk.torsoBottom.y);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Legs
    this._drawLimb(sk.hipL, sk.kneeL, this.lineWidth * 2.2, p.pants);
    this._drawLimb(sk.hipR, sk.kneeR, this.lineWidth * 2.2, p.pants);
    this._drawLimb(sk.kneeL, sk.footL, this.lineWidth * 2, p.pants);
    this._drawLimb(sk.kneeR, sk.footR, this.lineWidth * 2, p.pants);

    // Shoes
    ctx.fillStyle = p.shoes;
    ctx.beginPath();
    ctx.ellipse(sk.footL.x, sk.footL.y, 7 * this.scale, 4 * this.scale, 0, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.ellipse(sk.footR.x, sk.footR.y, 7 * this.scale, 4 * this.scale, 0, 0, Math.PI * 2);
    ctx.fill();

    // Arms
    this._drawLimb(sk.shoulderL, sk.elbowL, this.lineWidth * 1.8, p.shirt);
    this._drawLimb(sk.shoulderR, sk.elbowR, this.lineWidth * 1.8, p.shirt);
    this._drawLimb(sk.elbowL, sk.handL, this.lineWidth * 1.5, p.skin);
    this._drawLimb(sk.elbowR, sk.handR, this.lineWidth * 1.5, p.skin);

    // Hands
    ctx.fillStyle = p.skin;
    ctx.beginPath();
    ctx.arc(sk.handL.x, sk.handL.y, 4.5 * this.scale, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(sk.handR.x, sk.handR.y, 4.5 * this.scale, 0, Math.PI * 2);
    ctx.fill();
  }

  // ─── MAIN DRAW ──────────────────────────────────

  draw(x, y, time) {
    const ctx = this.ctx;

    // Transition blending (Principle 6: Slow in/out)
    if (this.transitionProgress < 1) {
      this.transitionProgress = Math.min(1, this.transitionProgress + 0.05);
    }

    const skeleton = this._getSkeleton(time, this.posture);

    ctx.save();
    ctx.translate(x, y);
    ctx.scale(this.direction, 1);

    // Principle 1: Global squash & stretch
    const { sx, sy } = this._squashStretch(time, 0.02);
    ctx.scale(sx, sy);

    // Draw order: legs → body → arms → head (back to front)
    this._drawBody(skeleton);
    this._drawFace(
      skeleton.head.x,
      skeleton.head.y,
      skeleton.head.radius,
      time
    );

    // Neck
    this._drawLimb(skeleton.neck, skeleton.head, this.lineWidth * 1.2, this.palette.skin);

    ctx.restore();
  }
}

// Export for both browser and Node
if (typeof module !== 'undefined') module.exports = { CrusaderCharacter };


// ═══════════════════════════════════════════════════
// INLINED: backgrounds.js
// ═══════════════════════════════════════════════════
/**
 * CRUSADER Delta — F03A L'INTERPRÉTEUR
 * backgrounds.js
 *
 * Décors vivants Canvas 2D — chaque élément "respire" via Math.sin(time).
 * Système modulaire : un Background peut combiner plusieurs layers.
 *
 * Backgrounds disponibles :
 * - CityBackground      : Ville nocturne avec gratte-ciels et néons
 * - NatureBackground     : Paysage nature avec collines, arbres, nuages
 * - OfficeBackground     : Bureau/intérieur avec fenêtres et mobilier
 * - AbstractBackground   : Fond abstrait géométrique (pour transitions)
 *
 * Usage:
 *   const bg = new NatureBackground(ctx, 1920, 1080);
 *   bg.draw(time);
 */

// ─── BASE CLASS ────────────────────────────────────

class CrusaderBackground {
  constructor(ctx, width, height, options = {}) {
    this.ctx = ctx;
    this.W = width;
    this.H = height;
    this.palette = options.palette || {};
  }

  draw(time) {
    // Override in subclass
  }

  _gradient(x0, y0, x1, y1, stops) {
    const g = this.ctx.createLinearGradient(x0, y0, x1, y1);
    stops.forEach(([offset, color]) => g.addColorStop(offset, color));
    return g;
  }
}

// ─── CITY BACKGROUND ──────────────────────────────

class CityBackground extends CrusaderBackground {
  constructor(ctx, width, height, options = {}) {
    super(ctx, width, height, options);
    this.buildings = this._generateBuildings();
    this.stars = this._generateStars(80);
  }

  _generateBuildings() {
    const buildings = [];
    let x = 0;
    while (x < this.W + 100) {
      const w = 40 + Math.random() * 80;
      const h = 100 + Math.random() * 350;
      buildings.push({
        x, w, h,
        windows: Math.floor(h / 30),
        windowCols: Math.floor(w / 20),
        hue: Math.floor(Math.random() * 360),
        neonChance: Math.random(),
      });
      x += w + 5 + Math.random() * 15;
    }
    return buildings;
  }

  _generateStars(count) {
    const stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({
        x: Math.random() * this.W,
        y: Math.random() * this.H * 0.4,
        size: 0.5 + Math.random() * 2,
        twinkleSpeed: 1 + Math.random() * 3,
        phase: Math.random() * Math.PI * 2,
      });
    }
    return stars;
  }

  draw(time) {
    const ctx = this.ctx;
    const W = this.W;
    const H = this.H;

    // Sky gradient — breathing color shift
    const skyShift = Math.sin(time * 0.2) * 10;
    const sky = this._gradient(0, 0, 0, H, [
      [0, `rgb(${10 + skyShift}, ${10 + skyShift}, ${40 + skyShift})`],
      [0.4, `rgb(${20 + skyShift}, ${15 + skyShift}, ${55 + skyShift})`],
      [0.8, `rgb(${30 + skyShift}, ${25 + skyShift}, ${70 + skyShift})`],
      [1, `rgb(${45 + skyShift}, ${35 + skyShift}, ${85 + skyShift})`],
    ]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Stars — twinkling
    this.stars.forEach(star => {
      const alpha = 0.3 + Math.sin(time * star.twinkleSpeed + star.phase) * 0.5;
      ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, alpha)})`;
      ctx.beginPath();
      ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
      ctx.fill();
    });

    // Moon — subtle glow
    const moonX = W * 0.8;
    const moonY = H * 0.12;
    const moonGlow = 30 + Math.sin(time * 0.5) * 10;
    ctx.fillStyle = `rgba(255, 255, 200, 0.08)`;
    ctx.beginPath();
    ctx.arc(moonX, moonY, moonGlow * 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFFDE7';
    ctx.beginPath();
    ctx.arc(moonX, moonY, 25, 0, Math.PI * 2);
    ctx.fill();

    // Ground
    ctx.fillStyle = '#1A1A2E';
    ctx.fillRect(0, H * 0.75, W, H * 0.25);

    // Buildings
    this.buildings.forEach(b => {
      const groundY = H * 0.75;
      const bx = b.x;
      const by = groundY - b.h;

      // Building body
      ctx.fillStyle = `hsl(${b.hue}, 5%, 12%)`;
      ctx.fillRect(bx, by, b.w, b.h);

      // Building outline
      ctx.strokeStyle = `hsl(${b.hue}, 10%, 20%)`;
      ctx.lineWidth = 1;
      ctx.strokeRect(bx, by, b.w, b.h);

      // Windows — some lit, some dark, breathing
      for (let row = 0; row < b.windows; row++) {
        for (let col = 0; col < b.windowCols; col++) {
          const wx = bx + 8 + col * 18;
          const wy = by + 10 + row * 28;
          if (wx + 10 > bx + b.w - 5) continue;

          const isLit = Math.sin(row * 3.7 + col * 2.3 + b.hue) > -0.3;
          if (isLit) {
            const flicker = 0.5 + Math.sin(time * 2 + row + col * 0.5 + b.hue) * 0.3;
            ctx.fillStyle = `rgba(255, 220, 100, ${flicker})`;
          } else {
            ctx.fillStyle = 'rgba(20, 20, 40, 0.8)';
          }
          ctx.fillRect(wx, wy, 10, 14);
        }
      }

      // Neon sign (some buildings)
      if (b.neonChance > 0.7) {
        const neonAlpha = 0.5 + Math.sin(time * 3 + b.hue) * 0.4;
        ctx.fillStyle = `hsla(${b.hue + 180}, 100%, 60%, ${neonAlpha})`;
        ctx.fillRect(bx + b.w * 0.2, by + 15, b.w * 0.6, 6);
        // Glow
        ctx.shadowColor = `hsla(${b.hue + 180}, 100%, 60%, 0.5)`;
        ctx.shadowBlur = 15;
        ctx.fillRect(bx + b.w * 0.2, by + 15, b.w * 0.6, 6);
        ctx.shadowBlur = 0;
      }
    });

    // Ground road lines
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.15)';
    ctx.lineWidth = 2;
    ctx.setLineDash([30, 20]);
    ctx.beginPath();
    ctx.moveTo(0, H * 0.88);
    ctx.lineTo(W, H * 0.88);
    ctx.stroke();
    ctx.setLineDash([]);

    // Atmospheric fog at ground level — breathing
    const fogAlpha = 0.08 + Math.sin(time * 0.3) * 0.04;
    const fogGrad = this._gradient(0, H * 0.7, 0, H, [
      [0, 'rgba(100, 100, 150, 0)'],
      [1, `rgba(100, 100, 150, ${fogAlpha})`],
    ]);
    ctx.fillStyle = fogGrad;
    ctx.fillRect(0, H * 0.7, W, H * 0.3);
  }
}

// ─── NATURE BACKGROUND ────────────────────────────

class NatureBackground extends CrusaderBackground {
  constructor(ctx, width, height, options = {}) {
    super(ctx, width, height, options);
    this.clouds = this._generateClouds(6);
    this.trees = this._generateTrees(12);
  }

  _generateClouds(count) {
    const clouds = [];
    for (let i = 0; i < count; i++) {
      clouds.push({
        x: Math.random() * this.W * 1.5,
        y: 50 + Math.random() * this.H * 0.2,
        scale: 0.5 + Math.random() * 1,
        speed: 8 + Math.random() * 15,
        phase: Math.random() * Math.PI * 2,
      });
    }
    return clouds;
  }

  _generateTrees(count) {
    const trees = [];
    for (let i = 0; i < count; i++) {
      trees.push({
        x: (i / count) * this.W + Math.random() * 80 - 40,
        scale: 0.6 + Math.random() * 0.8,
        swayPhase: Math.random() * Math.PI * 2,
        swaySpeed: 0.8 + Math.random() * 0.6,
        type: Math.random() > 0.5 ? 'pine' : 'round',
      });
    }
    return trees;
  }

  draw(time) {
    const ctx = this.ctx;
    const W = this.W;
    const H = this.H;

    // Sky — breathing gradient
    const dayShift = Math.sin(time * 0.15) * 20;
    const sky = this._gradient(0, 0, 0, H * 0.6, [
      [0, `rgb(${100 + dayShift}, ${170 + dayShift}, ${240 + dayShift})`],
      [0.6, `rgb(${160 + dayShift}, ${210 + dayShift}, ${250})`],
      [1, `rgb(${200 + dayShift}, ${230 + dayShift}, ${255})`],
    ]);
    ctx.fillStyle = sky;
    ctx.fillRect(0, 0, W, H);

    // Sun — gentle pulse
    const sunPulse = 35 + Math.sin(time * 0.8) * 3;
    ctx.fillStyle = 'rgba(255, 230, 100, 0.15)';
    ctx.beginPath();
    ctx.arc(W * 0.75, H * 0.12, sunPulse * 2.5, 0, Math.PI * 2);
    ctx.fill();
    ctx.fillStyle = '#FFE066';
    ctx.beginPath();
    ctx.arc(W * 0.75, H * 0.12, sunPulse, 0, Math.PI * 2);
    ctx.fill();

    // Clouds — drifting
    this.clouds.forEach(cloud => {
      const cx = ((cloud.x + time * cloud.speed) % (W + 200)) - 100;
      const cy = cloud.y + Math.sin(time * 0.5 + cloud.phase) * 5;
      const s = cloud.scale;

      ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
      ctx.beginPath();
      ctx.arc(cx, cy, 25 * s, 0, Math.PI * 2);
      ctx.arc(cx + 22 * s, cy - 8 * s, 20 * s, 0, Math.PI * 2);
      ctx.arc(cx + 40 * s, cy, 22 * s, 0, Math.PI * 2);
      ctx.arc(cx + 18 * s, cy + 5 * s, 18 * s, 0, Math.PI * 2);
      ctx.fill();
    });

    // Far hills — parallax breathing
    const hillBreath = Math.sin(time * 0.3) * 3;
    ctx.fillStyle = '#7CAE7A';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.55);
    for (let x = 0; x <= W; x += 40) {
      const h = Math.sin(x * 0.003 + 1) * 40 + Math.sin(x * 0.007) * 20 + hillBreath;
      ctx.lineTo(x, H * 0.52 - h);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    // Near hills
    ctx.fillStyle = '#5B9A5B';
    ctx.beginPath();
    ctx.moveTo(0, H * 0.65);
    for (let x = 0; x <= W; x += 30) {
      const h = Math.sin(x * 0.005 + 2) * 30 + Math.sin(x * 0.01) * 15 + hillBreath * 0.5;
      ctx.lineTo(x, H * 0.62 - h);
    }
    ctx.lineTo(W, H);
    ctx.lineTo(0, H);
    ctx.closePath();
    ctx.fill();

    // Ground
    ctx.fillStyle = '#4A8C4A';
    ctx.fillRect(0, H * 0.7, W, H * 0.3);

    // Grass details
    ctx.strokeStyle = '#3D7A3D';
    ctx.lineWidth = 1.5;
    for (let x = 0; x < W; x += 15) {
      const grassSway = Math.sin(time * 2 + x * 0.1) * 4;
      const grassH = 8 + Math.sin(x * 0.3) * 5;
      ctx.beginPath();
      ctx.moveTo(x, H * 0.7);
      ctx.quadraticCurveTo(x + grassSway, H * 0.7 - grassH, x + grassSway * 1.2, H * 0.7 - grassH * 1.2);
      ctx.stroke();
    }

    // Trees — swaying
    this.trees.forEach(tree => {
      const sway = Math.sin(time * tree.swaySpeed + tree.swayPhase) * 4 * tree.scale;
      const baseY = H * 0.7;
      const s = tree.scale;
      const tx = tree.x;

      // Trunk
      ctx.fillStyle = '#5D4037';
      ctx.beginPath();
      ctx.moveTo(tx - 5 * s, baseY);
      ctx.lineTo(tx - 3 * s + sway * 0.3, baseY - 50 * s);
      ctx.lineTo(tx + 3 * s + sway * 0.3, baseY - 50 * s);
      ctx.lineTo(tx + 5 * s, baseY);
      ctx.closePath();
      ctx.fill();

      // Foliage
      if (tree.type === 'pine') {
        ctx.fillStyle = '#2E7D32';
        for (let i = 0; i < 3; i++) {
          const ly = baseY - 35 * s - i * 22 * s;
          const lw = (25 - i * 6) * s;
          ctx.beginPath();
          ctx.moveTo(tx + sway * (0.5 + i * 0.2), ly - 20 * s);
          ctx.lineTo(tx - lw + sway * (0.3 + i * 0.1), ly);
          ctx.lineTo(tx + lw + sway * (0.3 + i * 0.1), ly);
          ctx.closePath();
          ctx.fill();
        }
      } else {
        ctx.fillStyle = '#388E3C';
        ctx.beginPath();
        ctx.arc(tx + sway, baseY - 65 * s, 28 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = '#2E7D32';
        ctx.beginPath();
        ctx.arc(tx - 12 * s + sway * 0.8, baseY - 55 * s, 20 * s, 0, Math.PI * 2);
        ctx.fill();
        ctx.beginPath();
        ctx.arc(tx + 14 * s + sway * 1.1, baseY - 58 * s, 18 * s, 0, Math.PI * 2);
        ctx.fill();
      }
    });

    // Ground path
    ctx.fillStyle = '#8D6E63';
    ctx.beginPath();
    ctx.moveTo(W * 0.3, H);
    ctx.quadraticCurveTo(W * 0.45, H * 0.75, W * 0.5, H * 0.7);
    ctx.quadraticCurveTo(W * 0.55, H * 0.75, W * 0.7, H);
    ctx.closePath();
    ctx.fill();
  }
}

// ─── OFFICE BACKGROUND ────────────────────────────

class OfficeBackground extends CrusaderBackground {
  draw(time) {
    const ctx = this.ctx;
    const W = this.W;
    const H = this.H;

    // Wall
    ctx.fillStyle = '#E8E0D4';
    ctx.fillRect(0, 0, W, H * 0.7);

    // Floor
    ctx.fillStyle = '#8B7355';
    ctx.fillRect(0, H * 0.7, W, H * 0.3);

    // Floor reflection
    const floorGrad = this._gradient(0, H * 0.7, 0, H, [
      [0, 'rgba(255, 255, 255, 0.1)'],
      [1, 'rgba(0, 0, 0, 0.05)'],
    ]);
    ctx.fillStyle = floorGrad;
    ctx.fillRect(0, H * 0.7, W, H * 0.3);

    // Window — with breathing light
    const lightPulse = 0.8 + Math.sin(time * 0.4) * 0.1;
    ctx.fillStyle = `rgba(200, 220, 255, ${lightPulse})`;
    ctx.fillRect(W * 0.1, H * 0.08, W * 0.35, H * 0.45);
    // Window frame
    ctx.strokeStyle = '#5D4037';
    ctx.lineWidth = 6;
    ctx.strokeRect(W * 0.1, H * 0.08, W * 0.35, H * 0.45);
    // Window cross
    ctx.beginPath();
    ctx.moveTo(W * 0.275, H * 0.08);
    ctx.lineTo(W * 0.275, H * 0.53);
    ctx.moveTo(W * 0.1, H * 0.3);
    ctx.lineTo(W * 0.45, H * 0.3);
    ctx.stroke();

    // Light rays from window — breathing
    ctx.fillStyle = `rgba(255, 250, 220, ${0.03 + Math.sin(time * 0.5) * 0.015})`;
    ctx.beginPath();
    ctx.moveTo(W * 0.1, H * 0.53);
    ctx.lineTo(W * 0.45, H * 0.53);
    ctx.lineTo(W * 0.65, H * 0.7);
    ctx.lineTo(0, H * 0.7);
    ctx.closePath();
    ctx.fill();

    // Desk
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(W * 0.55, H * 0.5, W * 0.35, H * 0.04);
    // Desk legs
    ctx.fillRect(W * 0.57, H * 0.54, 0.015 * W, H * 0.16);
    ctx.fillRect(W * 0.87, H * 0.54, 0.015 * W, H * 0.16);

    // Monitor on desk
    ctx.fillStyle = '#333';
    ctx.fillRect(W * 0.65, H * 0.3, W * 0.15, H * 0.2);
    // Screen glow — breathing
    const screenGlow = 0.7 + Math.sin(time * 1.5) * 0.2;
    ctx.fillStyle = `rgba(100, 150, 255, ${screenGlow})`;
    ctx.fillRect(W * 0.655, H * 0.31, W * 0.14, H * 0.18);
    // Monitor stand
    ctx.fillStyle = '#333';
    ctx.fillRect(W * 0.715, H * 0.5, W * 0.02, -H * 0.02);

    // Plant — breathing/swaying
    const plantSway = Math.sin(time * 1.2) * 3;
    const plantX = W * 0.92;
    const plantY = H * 0.5;
    // Pot
    ctx.fillStyle = '#A0522D';
    ctx.beginPath();
    ctx.moveTo(plantX - 15, plantY);
    ctx.lineTo(plantX - 12, plantY + 25);
    ctx.lineTo(plantX + 12, plantY + 25);
    ctx.lineTo(plantX + 15, plantY);
    ctx.closePath();
    ctx.fill();
    // Leaves
    ctx.fillStyle = '#4CAF50';
    for (let i = 0; i < 5; i++) {
      const angle = (i / 5) * Math.PI - Math.PI / 2 + plantSway * 0.02;
      const leafLen = 20 + Math.sin(i * 2) * 8;
      ctx.beginPath();
      ctx.ellipse(
        plantX + Math.cos(angle) * leafLen * 0.5 + plantSway * (i % 2 ? 1 : -1) * 0.3,
        plantY - 5 + Math.sin(angle) * leafLen * 0.5,
        leafLen * 0.6, 6, angle, 0, Math.PI * 2
      );
      ctx.fill();
    }

    // Wall art
    ctx.strokeStyle = '#8D6E63';
    ctx.lineWidth = 3;
    ctx.strokeRect(W * 0.6, H * 0.08, W * 0.12, H * 0.15);
    ctx.fillStyle = '#E0D0C0';
    ctx.fillRect(W * 0.605, H * 0.085, W * 0.11, H * 0.14);

    // Baseboard
    ctx.fillStyle = '#5D4037';
    ctx.fillRect(0, H * 0.68, W, H * 0.02);
  }
}

// ─── ABSTRACT BACKGROUND ──────────────────────────

class AbstractBackground extends CrusaderBackground {
  constructor(ctx, width, height, options = {}) {
    super(ctx, width, height, options);
    this.shapes = this._generateShapes(20);
  }

  _generateShapes(count) {
    const shapes = [];
    for (let i = 0; i < count; i++) {
      shapes.push({
        x: Math.random() * this.W,
        y: Math.random() * this.H,
        size: 20 + Math.random() * 60,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.5,
        hue: Math.floor(Math.random() * 360),
        type: ['circle', 'square', 'triangle'][Math.floor(Math.random() * 3)],
        phase: Math.random() * Math.PI * 2,
        floatSpeed: 0.3 + Math.random() * 0.7,
      });
    }
    return shapes;
  }

  draw(time) {
    const ctx = this.ctx;
    const W = this.W;
    const H = this.H;

    // Deep background — breathing gradient
    const hueShift = time * 10;
    const bg = this._gradient(0, 0, W, H, [
      [0, `hsl(${(220 + hueShift) % 360}, 30%, 8%)`],
      [0.5, `hsl(${(250 + hueShift) % 360}, 25%, 12%)`],
      [1, `hsl(${(280 + hueShift) % 360}, 30%, 8%)`],
    ]);
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    // Floating shapes
    this.shapes.forEach(shape => {
      const fx = shape.x + Math.sin(time * shape.floatSpeed + shape.phase) * 30;
      const fy = shape.y + Math.cos(time * shape.floatSpeed * 0.7 + shape.phase) * 20;
      const rot = shape.rotation + time * shape.rotSpeed;
      const alpha = 0.1 + Math.sin(time * 0.5 + shape.phase) * 0.08;
      const pulse = shape.size + Math.sin(time + shape.phase) * 5;

      ctx.save();
      ctx.translate(fx, fy);
      ctx.rotate(rot);
      ctx.fillStyle = `hsla(${shape.hue}, 60%, 50%, ${alpha})`;
      ctx.strokeStyle = `hsla(${shape.hue}, 70%, 60%, ${alpha * 2})`;
      ctx.lineWidth = 1.5;

      switch (shape.type) {
        case 'circle':
          ctx.beginPath();
          ctx.arc(0, 0, pulse / 2, 0, Math.PI * 2);
          ctx.fill();
          ctx.stroke();
          break;
        case 'square':
          ctx.fillRect(-pulse / 2, -pulse / 2, pulse, pulse);
          ctx.strokeRect(-pulse / 2, -pulse / 2, pulse, pulse);
          break;
        case 'triangle':
          ctx.beginPath();
          ctx.moveTo(0, -pulse / 2);
          ctx.lineTo(-pulse / 2, pulse / 2);
          ctx.lineTo(pulse / 2, pulse / 2);
          ctx.closePath();
          ctx.fill();
          ctx.stroke();
          break;
      }
      ctx.restore();
    });

    // Grid overlay — subtle breathing
    ctx.strokeStyle = `rgba(255, 255, 255, ${0.03 + Math.sin(time * 0.4) * 0.01})`;
    ctx.lineWidth = 0.5;
    const gridSize = 80;
    for (let x = 0; x < W; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }
}

// Export
if (typeof module !== 'undefined') {
  module.exports = { CrusaderBackground, CityBackground, NatureBackground, OfficeBackground, AbstractBackground };
}

// INLINED: effects.js
// ═══════════════════════════════════════════════════
/**
 * CRUSADER Delta — F03A L'INTERPRÉTEUR
 * effects.js
 *
 * Effets visuels Canvas 2D pour enrichir les scènes.
 * - ParticleSystem   : Particules génériques (poussière, pluie, neige, étincelles)
 * - ScreenShake      : Tremblement d'écran pour les moments dramatiques
 * - VignetteEffect   : Assombrissement des bords
 * - TextOverlay      : Texte animé avec typing effect
 */

// ─── PARTICLE SYSTEM ──────────────────────────────

class ParticleSystem {
  constructor(ctx, width, height, options = {}) {
    this.ctx = ctx;
    this.W = width;
    this.H = height;
    this.type = options.type || 'dust'; // dust, rain, snow, sparks
    this.count = options.count || 50;
    this.particles = [];
    this._init();
  }

  _init() {
    for (let i = 0; i < this.count; i++) {
      this.particles.push(this._createParticle());
    }
  }

  _createParticle() {
    const configs = {
      dust: {
        x: Math.random() * this.W,
        y: Math.random() * this.H,
        vx: (Math.random() - 0.5) * 0.3,
        vy: -0.2 - Math.random() * 0.3,
        size: 1 + Math.random() * 2.5,
        alpha: 0.1 + Math.random() * 0.3,
        color: '255, 255, 255',
        life: Math.random(),
      },
      rain: {
        x: Math.random() * this.W,
        y: Math.random() * this.H,
        vx: -1,
        vy: 8 + Math.random() * 6,
        size: 1,
        length: 10 + Math.random() * 15,
        alpha: 0.2 + Math.random() * 0.3,
        color: '150, 180, 255',
        life: Math.random(),
      },
      snow: {
        x: Math.random() * this.W,
        y: Math.random() * this.H,
        vx: (Math.random() - 0.5) * 0.5,
        vy: 0.5 + Math.random() * 1.5,
        size: 2 + Math.random() * 4,
        alpha: 0.3 + Math.random() * 0.5,
        color: '255, 255, 255',
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 1 + Math.random() * 2,
        life: Math.random(),
      },
      sparks: {
        x: this.W * 0.5 + (Math.random() - 0.5) * 100,
        y: this.H * 0.5,
        vx: (Math.random() - 0.5) * 4,
        vy: -2 - Math.random() * 4,
        size: 1 + Math.random() * 2,
        alpha: 0.5 + Math.random() * 0.5,
        color: '255, 200, 50',
        life: Math.random(),
        decay: 0.005 + Math.random() * 0.01,
      },
    };
    return { ...configs[this.type] };
  }

  draw(time) {
    const ctx = this.ctx;

    this.particles.forEach((p, i) => {
      // Update position
      p.x += p.vx;
      p.y += p.vy;

      // Type-specific behavior
      if (this.type === 'snow') {
        p.x += Math.sin(time * p.wobbleSpeed + p.wobble) * 0.5;
      }

      if (this.type === 'sparks') {
        p.vy += 0.05; // gravity
        p.alpha -= p.decay;
      }

      if (this.type === 'dust') {
        p.alpha = (0.1 + Math.random() * 0.2) * (0.5 + Math.sin(time + i) * 0.5);
      }

      // Recycle particles
      if (p.y > this.H + 20 || p.y < -20 || p.x > this.W + 20 || p.x < -20 || p.alpha <= 0) {
        const newP = this._createParticle();
        if (this.type === 'rain' || this.type === 'snow') newP.y = -10;
        Object.assign(p, newP);
      }

      // Draw
      ctx.fillStyle = `rgba(${p.color}, ${Math.max(0, p.alpha)})`;

      if (this.type === 'rain') {
        ctx.strokeStyle = `rgba(${p.color}, ${p.alpha})`;
        ctx.lineWidth = p.size;
        ctx.beginPath();
        ctx.moveTo(p.x, p.y);
        ctx.lineTo(p.x + p.vx * 2, p.y - p.length);
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      }
    });
  }
}

// ─── SCREEN SHAKE ─────────────────────────────────

class ScreenShake {
  constructor() {
    this.intensity = 0;
    this.decay = 0.95;
  }

  trigger(intensity = 10) {
    this.intensity = intensity;
  }

  apply(ctx) {
    if (this.intensity > 0.5) {
      const dx = (Math.random() - 0.5) * this.intensity;
      const dy = (Math.random() - 0.5) * this.intensity;
      ctx.translate(dx, dy);
      this.intensity *= this.decay;
    } else {
      this.intensity = 0;
    }
  }
}

// ─── VIGNETTE EFFECT ──────────────────────────────

class VignetteEffect {
  constructor(ctx, width, height, options = {}) {
    this.ctx = ctx;
    this.W = width;
    this.H = height;
    this.intensity = options.intensity || 0.4;
    this.breathe = options.breathe !== false;
  }

  draw(time) {
    const ctx = this.ctx;
    const cx = this.W / 2;
    const cy = this.H / 2;
    const radius = Math.max(this.W, this.H) * 0.7;
    const intensity = this.breathe
      ? this.intensity + Math.sin(time * 0.3) * 0.05
      : this.intensity;

    const grad = ctx.createRadialGradient(cx, cy, radius * 0.3, cx, cy, radius);
    grad.addColorStop(0, 'rgba(0, 0, 0, 0)');
    grad.addColorStop(1, `rgba(0, 0, 0, ${intensity})`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, this.W, this.H);
  }
}

// ─── TEXT OVERLAY ─────────────────────────────────

class TextOverlay {
  constructor(ctx, options = {}) {
    this.ctx = ctx;
    this.font = options.font || 'bold 32px sans-serif';
    this.color = options.color || '#FFFFFF';
    this.shadowColor = options.shadowColor || 'rgba(0,0,0,0.5)';
    this.align = options.align || 'center';
  }

  draw(text, x, y, time, options = {}) {
    const ctx = this.ctx;
    const typing = options.typing || false;
    const fadeIn = options.fadeIn || false;

    let displayText = text;
    if (typing && time !== undefined) {
      const charsVisible = Math.floor(time * (options.typingSpeed || 15));
      displayText = text.substring(0, Math.min(charsVisible, text.length));
    }

    let alpha = 1;
    if (fadeIn && time !== undefined) {
      alpha = Math.min(1, time * 2);
    }

    ctx.save();
    ctx.font = this.font;
    ctx.textAlign = this.align;
    ctx.textBaseline = 'middle';

    // Shadow
    ctx.fillStyle = this.shadowColor;
    ctx.fillText(displayText, x + 2, y + 2);

    // Text
    ctx.fillStyle = this.color;
    ctx.globalAlpha = alpha;
    ctx.fillText(displayText, x, y);

    ctx.restore();
  }
}

// Export
if (typeof module !== 'undefined') {
  module.exports = { ParticleSystem, ScreenShake, VignetteEffect, TextOverlay };
}
