ame from a predetermined list maintained by the World Meteorological Organization. The naming system was introduced in 1923, initially using only female names. Male names were added in 1979.",start_frame:20,end_frame:514,start:.66,end:17.14,overlay_type:"vent",overlay_intensite:2,media_type:"image",sfx_trigger:!0},{id:2,image_file:"frame_000101.png",text_subtitles:"If a storm causes exceptional damage or death, its name is permanently retired. Since Saint-Quentin-Carte, over 90 names have been retired from the Atlantic list, including Katrina, Harvey and Maria. Category 1 hurricane. A category 1 hurricane has sustained winds between 75 and 95 miles per hour.",start_frame:523,end_frame:980,start:17.44,end:32.66,overlay_type:"vent",overlay_intensite:2,media_type:"image",sfx_trigger:!0},{id:3,image_file:"frame_000099.png",text_subtitles:"On the Saffir-Simpson scale, it is classified as causing minimal structural damage to well-built homes. However, the term minimal is misleading. The category 1 hurricane can topple trees, snap powerlines and leave entire regions without electricity for days. Hurricane Dolly in 2008 made landfall in Texas as a category 1 and still caused",start_frame:985,end_frame:1502,start:32.84,end:50.08,overlay_type:"vent",overlay_intensite:2,media_type:"image",sfx_trigger:!0},{id:4,image_file:"gif_0001.gif",text_subtitles:"over 1.5 billion dollars in damage. No hurricane should be taken lightly because of its category number. Category 3 hurricane. Category 3 hurricane is the threshold for what meteorologists classify as a major hurricane. Sustained winds range from 111 to 129 miles per hour.",start_frame:1502,end_frame:1941,start:50.08,end:64.7,overlay_type:"defaut",overlay_intensite:2,media_type:"gif",sfx_trigger:!0},{id:5,image_file:"frame_000100.png",text_subtitles:"At this intensity, well-built homes can suffer structural damage including the removal of roof decking and gable ends. Hurricane Tien Water may be unavailable for weeks after the storm passes. Hurricane Katrina made its final landfall near the Louisiana-Mississippi border as a category 3 in 2005.",start_frame:1948,end_frame:2401,start:64.94,end:80.04,overlay_type:"vent",overlay_intensite:2,media_type:"image",sfx_trigger:!0},{id:6,image_file:"frame_000152.png",text_subtitles:"Despite weakening from its peak intensity, it produced a storm surge exceeding 25 feet and caused over 125 billion dollars in damage, making it one of the costliest natural disasters in human history. Category 5 is the highest classification on the Saphir-Simpson scale, with sustained winds of 157 miles per hour or greater.",start_frame:2408,end_frame:2957,start:80.26,end:98.58,overlay_type:"pluie",overlay_intensite:3,media_type:"image",sfx_trigger:!0},{id:7,image_file:"frame_000234.png",text_subtitles:"At this intensity, a high percentage of homes will be destroyed, with total roof failure and wall collapse. The affected area may be uninhabitable for weeks or months. In the entire recorded history of Atlantic hurricanes, only four category 5 storms have made landfall in the continental United States.",start_frame:2960,end_frame:3416,start:98.68,end:113.88,overlay_type:"defaut",overlay_intensite:2,media_type:"image",sfx_trigger:!0},{id:8,image_file:"gif_0002.gif",text_subtitles:"The Labor Day Hurricane of Nineteenth 35, Hurricane Cami in Nineteenth 92, and Hurricane Michael in 2018. Hurricane Irma in 2017 maintained category 5 intensity winds of 1.85 miles per hour for 37 consecutive hours.",start_frame:3416,end_frame:3849,start:113.88,end:128.3,overlay_type:"defaut",overlay_intensite:2,media_type:"gif",sfx_trigger:!0},{id:9,image_file:"frame_000008.png",text_subtitles:"The longest any cyclone on Earth has ever sustained that wind speed. A single hurricane releases the energy equivalent of roughly through the formation of a typhoon. A super typhoon is a typhoon with sustained winds of 1.15 miles per hour or greater.",start_frame:3856,end_frame:4306,start:128.52,end:143.52,overlay_type:"vent",overlay_intensite:2,media_type:"image",sfx_trigger:!0},{id:10,image_file:"frame_000129.png",text_subtitles:"Equivalent to a strong category 4, or category 5 hurricane. Typhoon Haiyan struck the Philippines in 2003 with sustained winds of one of the strongest landfalls ever recorded. It killed over 6,300 people and displaced 4 million. Typhoon Tip in 1979 holds the record for the largest tropical cyclone ever measured,",start_frame:4306,end_frame:4876,start:143.52,end:162.54,overlay_type:"defaut",overlay_intensite:3,media_type:"image",sfx_trigger:!0},{id:11,image_file:"frame_000244.png",text_subtitles:"with a circulation spanning 1,300 kms in diameter. That is wider than the distance from New York City to Houston. Cyclone Along the Indian Ocean and South Pacific, the same type of storm is called a cyclone.",start_frame:4882,end_frame:5209,start:162.74,end:173.62,overlay_type:"defaut",overlay_intensite:2,media_type:"image",sfx_trigger:!0},{id:12,image_file:"gif_0003.gif",text_subtitles:"The physics are identical, but cyclones south of the equator rotate clockwise, opposite to hurricanes and typhoons in the Northern Hemisphere. This is caused by the Coriolis effect. The deadliest tropical cyclone in recorded history was the Bola Cyclone,",start_frame:5210,end_frame:5569,start:173.68,end:185.64,overlay_type:"defaut",overlay_intensite:3,media_type:"gif",sfx_trigger:!0},{id:13,image_file:"frame_000126.png",text_subtitles:"which struck Bangladesh in 1970 and killed an estimated 300,000 to 500,000 people, making it one of the single deadliest natural disasters in human history. Bomb Cyclone A bomb cyclone, formerly known as Explosive Sixogenesis,",start_frame:5573,end_frame:5992,start:185.76,end:199.72,overlay_type:"defaut",overlay_intensite:3,media_type:"image",sfx_trigger:!0},{id:14,image_file:"frame_000105.png",text_subtitles:"occurs when at least 24 millibars in 24 hours. This rapid intensification can turn an ordinary storm into a monster in less than a day. While the term is most commonly applied to extra-tropical winter storms, tropical cyclones can also have explosive intensification. Hurricane Patricia in Winiflux intensified a tropical storm to a Category 5 hurricane,",start_frame:5992,end_frame:6545,start:199.72,end:218.18,overlay_type:"vent",overlay_intensite:2,media_type:"image",sfx_trigger:!0},{id:15,image_file:"frame_000013.png",text_subtitles:"with winds of 215 miles per hour in just 24 hours, the most rapid intensification ever recorded in the Western Hemisphere. Hypercane A hypercane is a hypocentric tropical cyclone that is theoretically possible under extreme conditions.",start_frame:6551,end_frame:6937,start:218.36,end:231.24,overlay_type:"vent",overlay_intensite:2,media_type:"image",sfx_trigger:!0},{id:16,image_file:"gif_0004.gif",text_subtitles:"First proposed by MIT atmospheric scientist Kerry Emanuel in 2014, a hypercane could form if ocean surface temperatures reached approximately 50 degrees Celsius, roughly 20 degrees warmer than the hottest ocean temperatures recorded today. A hypercane would produce sustained winds exceeding 500 miles per hour",start_frame:6947,end_frame:7487,start:231.56,end:249.56,overlay_type:"defaut",overlay_intensite:2,media_type:"gif",sfx_trigger:!0},{id:17,image_file:"frame_000017.png",text_subtitles:"and an high wall reaching into the stratosphere at an altitude of over 20 miles. Some scientists have speculated that hypercanes may have formed in the aftermath of the asteroid impact that killed the dinosaurs, when ocean temperatures near the impact site could have temporarily exceeded the threshold. However, no hypercane has ever been confirmed to exist.",start_frame:7487,end_frame:8026,start:249.56,end:267.52,overlay_type:"defaut",overlay_intensite:2,media_type:"image",sfx_trigger:!0}],validated_by_magos:!0},xd={meta:{fps:30,duration_seconds:267.6756,total_frames:8030,audio_path:"/tmp/f01_out/audio_clean.mp3",model:"medium",language:"fr",language_probability:.69
