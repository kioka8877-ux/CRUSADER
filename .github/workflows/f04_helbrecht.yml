name: F04 HELBRECHT — Finalisation YouTube

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Identifiant unique du run (ex: CRS_20240101_1200)"
        required: true
      mode:
<<<<<<< HEAD
        description: "Mode de production (alpha|beta|gamma|delta)"
=======
        description: "Mode de production (alpha/beta/gamma/delta)"
>>>>>>> c0110f4 (DELTA: copy gamma/ from delta-test3 → delta/ on main — production validated)
        required: false
        default: "delta"

jobs:
  helbrecht:
    name: "F04 — Camouflage + Finalisation"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérification FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "[FFMPEG] ✅ $(ffmpeg -version 2>&1 | head -1)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Télécharger assets depuis GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          mkdir -p /tmp/f04_in
          BASE_URL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.run_id }}-f04"
          for FNAME in short_render.mp4 timing.json; do
            wget -q \
              --header="Authorization: token $GH_TOKEN" \
              -O "/tmp/f04_in/$FNAME" \
              "${BASE_URL}/${FNAME}"
            echo "[F04] $FNAME — $(du -h /tmp/f04_in/$FNAME | cut -f1) ✅"
          done
          # Beta : télécharger roadmap.json si disponible
          if [ "${{ github.event.inputs.mode }}" = "beta" ] || [ "${{ github.event.inputs.mode }}" = "gamma" ]; then
            RMURL="https://github.com/${{ github.repository }}/releases/download/${{ github.event.inputs.run_id }}/roadmap.json"
            wget -q --header="Authorization: token $GH_TOKEN" -O "/tmp/f04_in/roadmap.json" "$RMURL" \
              && echo "[F04-beta] roadmap.json téléchargé ✅" \
              || echo "[F04-beta] roadmap.json absent (SFX ignorés)"
            # SFX : copier depuis SHARED/IN/sfx/ du repo si présents
            mkdir -p /tmp/f04_sfx
            cp ${{ github.event.inputs.mode }}/SHARED/IN/sfx/*.mp3 /tmp/f04_sfx/ 2>/dev/null \
              && echo "[F04-beta] fichiers SFX copiés ✅" \
              || echo "[F04-beta] aucun SFX dans SHARED/IN/sfx/ (SFX ignorés)"
          fi

      - name: F04 — Assemblage final
        run: |
          mkdir -p /tmp/f04_out
          EXTRA_ARGS=""
          if [ "${{ github.event.inputs.mode }}" = "beta" ] || [ "${{ github.event.inputs.mode }}" = "gamma" ] && [ -f /tmp/f04_in/roadmap.json ]; then
            EXTRA_ARGS="--roadmap /tmp/f04_in/roadmap.json --sfx-dir /tmp/f04_sfx"
          fi
          python3 ${{ github.event.inputs.mode }}/F04_HELBRECHT/CODEBASE/crs_f04_helbrecht.py \
            --input /tmp/f04_in \
            --output /tmp/f04_out \
            $EXTRA_ARGS

      - name: Vérifier sortie F04
        run: |
          echo "[F04] Artefacts produits :"
          ls -lh /tmp/f04_out/
          MP4=$(ls /tmp/f04_out/*.mp4 2>/dev/null | head -1)
          if [ -z "$MP4" ]; then
            echo "❌ Aucun .mp4 trouvé dans /tmp/f04_out/"
            exit 1
          fi
          DURATION=$(ffprobe -v error -show_entries format=duration \
            -of default=noprint_wrappers=1:nokey=1 "$MP4" 2>/dev/null | xargs printf "%.1f")
          echo "✅ $(basename $MP4) — $(du -h $MP4 | cut -f1) — ${DURATION}s"

      - name: Upload artefact F04 (pré-Luther)
        uses: actions/upload-artifact@v4
        with:
          name: youtube-final
          path: /tmp/f04_out/*.mp4
          retention-days: 30

  luther:
    name: "F05 LUTHER — Effacement empreinte"
    runs-on: ubuntu-latest
    needs: helbrecht
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Vérification FFmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1; then
            echo "[LUTHER] ✅ $(ffmpeg -version 2>&1 | head -1)"
          else
            sudo apt-get update -qq
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Télécharger artefact F04
        uses: actions/download-artifact@v4
        with:
          name: youtube-final
          path: /tmp/luther_in

      - name: Renommer vers youtube_final.mp4
        run: |
          MP4=$(ls /tmp/luther_in/*.mp4 | head -1)
          mv "$MP4" /tmp/luther_in/youtube_final.mp4
          echo "[LUTHER] Source : $(du -h /tmp/luther_in/youtube_final.mp4 | cut -f1)"

      - name: F05 LUTHER — Strip métadonnées
        run: |
          mkdir -p /tmp/luther_out
          python3 ${{ github.event.inputs.mode }}/F05_LUTHER/CODEBASE/crs_f05_luther.py \
            --input  /tmp/luther_in \
            --output /tmp/luther_out \
            --date   "$(date +%Y-%m-%d)"

      - name: Vérifier sortie Luther
        run: |
          MP4=/tmp/luther_out/clean_final.mp4
          if [ ! -f "$MP4" ]; then
            echo "❌ clean_final.mp4 absent"
            exit 1
          fi
          SIZE=$(du -h "$MP4" | cut -f1)
          echo "✅ clean_final.mp4 — $SIZE — empreinte effacée"
          echo "Tags résiduels :"
          ffprobe -v quiet -print_format json -show_format "$MP4" \
            | python3 -c "import json,sys; d=json.load(sys.stdin); tags=d.get('format',{}).get('tags',{}); print(tags if tags else '  (aucun)')"

      - name: Upload artefact final propre
        uses: actions/upload-artifact@v4
        with:
          name: clean-final
          path: /tmp/luther_out/clean_final.mp4
          retention-days: 90
