name: F00 ASSET FORGE - Ingest + Extract + Process + Index

on:
  workflow_dispatch:
    inputs:
      video_urls:
        description: "URLs vidéo séparées par virgules (NASA, NOAA, ESA, USGS, Internet Archive, YouTube)"
        required: true
      mode:
        description: "Mode de traitement (characters|nature|backgrounds|all)"
        required: false
        default: "all"
      extract_fps:
        description: "Frames par seconde pour l'extraction"
        required: false
        default: "1"
      gif_duration:
        description: "Durée des GIFs en secondes"
        required: false
        default: "3"
      clip_duration:
        description: "Durée des clips MP4 en secondes"
        required: false
        default: "3"
      gif_count:
        description: "Nombre de GIFs par vidéo (répartis uniformément)"
        required: false
        default: "5"
      clip_count:
        description: "Nombre de clips par vidéo (répartis uniformément)"
        required: false
        default: "5"

jobs:
  asset_forge:
    name: "F00 — Ingest + Extract + Process + Index"
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      # === CHECKOUT (branche f00-asset-forge, pas main) ===
      - name: Checkout f00-asset-forge branch
        uses: actions/checkout@v4
        with:
          ref: f00-asset-forge

      # === INSTALL DEPENDENCIES ===
      - name: Install yt-dlp
        run: |
          curl -L https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Install Python dependencies
        run: |
          pip install rembg[cpu] pillow
          python -c "from rembg import remove; print('rembg OK')"
          python -c "from PIL import Image; print('pillow OK')"

      - name: Install FFmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1
          ffprobe -version | head -1

      # === STEP 1: INGEST ===
      - name: F00-1 INGEST — Download source videos
        id: ingest
        run: |
          cd F00_ASSET_FORGE/CODEBASE
          python crs_f00_ingest.py "${{ inputs.video_urls }}" --output /tmp/downloads 2>&1 | tee /tmp/ingest_log.txt
          echo "INGEST_DONE=true" >> $GITHUB_OUTPUT

      # === STEP 2: EXTRACT ===
      - name: F00-2 EXTRACT — FFmpeg batch extraction
        id: extract
        run: |
          cd F00_ASSET_FORGE/CODEBASE
          
          # Pour chaque vidéo téléchargée, extraire frames + GIFs + clips
          # IFS=$'\n' pour gérer les espaces dans les noms de fichiers
          IFS=$'\n'
          VIDEO_FILES=$(find /tmp/downloads -type f \( -name "*.mp4" -o -name "*.webm" -o -name "*.mov" \) | head -20)
          
          for VIDEO in $VIDEO_FILES; do
            echo "=== Extraction: $VIDEO ==="
            python crs_f00_extract.py "$VIDEO" \
              --output /tmp/extracted \
              --fps ${{ inputs.extract_fps }} \
              --gif-duration ${{ inputs.gif_duration }} \
              --clip-duration ${{ inputs.clip_duration }} \
              --gif-count ${{ inputs.gif_count }} \
              --clip-count ${{ inputs.clip_count }} 2>&1 | tee -a /tmp/extract_log.txt
            # Fail si le script Python échoue
            PIPE_STATUS=${PIPESTATUS[0]}
            if [ $PIPE_STATUS -ne 0 ]; then
              echo "ERREUR: extraction échouée pour $VIDEO (exit code $PIPE_STATUS)"
              exit 1
            fi
          done
          
          echo "EXTRACT_DONE=true" >> $GITHUB_OUTPUT

      # === STEP 3: PROCESS (per-video subdirs) ===
      - name: F00-3 PROCESS — Rembg + chroma key (per-video)
        id: process
        run: |
          cd F00_ASSET_FORGE/CODEBASE
          
          MODE="${{ inputs.mode }}"
          
          # Traiter chaque vidéo dans son propre sous-dossier
          # /tmp/extracted/<video_name>/frames → /tmp/processed/<video_name>/frames
          for VIDEO_DIR in /tmp/extracted/*/; do
            VIDEO_NAME=$(basename "$VIDEO_DIR")
            echo "=== Processing video: $VIDEO_NAME ==="
            
            FRAMES_DIR="$VIDEO_DIR/frames"
            GIFS_DIR="$VIDEO_DIR/gifs"
            
            if [ -d "$FRAMES_DIR" ]; then
              echo "  Frames: $FRAMES_DIR → /tmp/processed/$VIDEO_NAME/frames"
              python crs_f00_process.py \
                --frames "$FRAMES_DIR" \
                --output "/tmp/processed/$VIDEO_NAME/frames" \
                --mode "$MODE" 2>&1 | tee -a /tmp/process_log.txt
              PIPE_STATUS=${PIPESTATUS[0]}
              if [ $PIPE_STATUS -ne 0 ]; then
                echo "ERREUR: processing frames échoué pour $VIDEO_NAME"
                exit 1
              fi
            fi
            
            if [ -d "$GIFS_DIR" ]; then
              echo "  GIFs: $GIFS_DIR → /tmp/processed/$VIDEO_NAME/gifs"
              python crs_f00_process.py \
                --gifs "$GIFS_DIR" \
                --output "/tmp/processed/$VIDEO_NAME/gifs" \
                --mode "$MODE" 2>&1 | tee -a /tmp/process_log.txt
              PIPE_STATUS=${PIPESTATUS[0]}
              if [ $PIPE_STATUS -ne 0 ]; then
                echo "ERREUR: processing GIFs échoué pour $VIDEO_NAME"
                exit 1
              fi
            fi
          done
          
          echo "PROCESS_DONE=true" >> $GITHUB_OUTPUT

      # === STEP 4: DISTRIBUTE TO BANKS (per-video subdirs) ===
      - name: F00-4 DISTRIBUTE — Copy assets to per-video subfolders
        run: |
          MODE="${{ inputs.mode }}"
          FORGE_ROOT="F00_ASSET_FORGE"
          
          # Chaque vidéo source obtient son propre sous-dossier
          # BANK_B_NATURE/fire/<video_name>/frame_000001.png
          # Cela évite l'écrasement entre vidéos
          
          if [ "$MODE" = "nature" ] || [ "$MODE" = "all" ]; then
            for VIDEO_DIR in /tmp/processed/*/; do
              VIDEO_NAME=$(basename "$VIDEO_DIR")
              TARGET="$FORGE_ROOT/BANK_B_NATURE/fire/$VIDEO_NAME"
              mkdir -p "$TARGET"
              
              # Copier les frames
              if [ -d "$VIDEO_DIR/frames" ]; then
                cp "$VIDEO_DIR/frames/"*.png "$TARGET/" 2>/dev/null || true
                echo "  $VIDEO_NAME: $(ls "$TARGET/"*.png 2>/dev/null | wc -l) frames"
              fi
              
              # Copier les GIFs
              if [ -d "$VIDEO_DIR/gifs" ]; then
                cp "$VIDEO_DIR/gifs/"*.gif "$TARGET/" 2>/dev/null || true
                echo "  $VIDEO_NAME: $(ls "$TARGET/"*.gif 2>/dev/null | wc -l) GIFs"
              fi
            done
          fi
          
          if [ "$MODE" = "characters" ] || [ "$MODE" = "all" ]; then
            for VIDEO_DIR in /tmp/processed/*/; do
              VIDEO_NAME=$(basename "$VIDEO_DIR")
              TARGET="$FORGE_ROOT/BANK_A_CHARACTERS/standing/$VIDEO_NAME"
              mkdir -p "$TARGET"
              if [ -d "$VIDEO_DIR/frames" ]; then
                cp "$VIDEO_DIR/frames/"*.png "$TARGET/" 2>/dev/null || true
              fi
            done
          fi
          
          if [ "$MODE" = "backgrounds" ] || [ "$MODE" = "all" ]; then
            for VIDEO_DIR in /tmp/processed/*/; do
              VIDEO_NAME=$(basename "$VIDEO_DIR")
              TARGET="$FORGE_ROOT/BANK_C_BACKGROUNDS/outdoor/$VIDEO_NAME"
              mkdir -p "$TARGET"
              if [ -d "$VIDEO_DIR/frames" ]; then
                cp "$VIDEO_DIR/frames/"*.png "$TARGET/" 2>/dev/null || true
              fi
            done
          fi
          
          # Les clips → BANK_D (par vidéo aussi)
          for VIDEO_DIR in /tmp/extracted/*/; do
            VIDEO_NAME=$(basename "$VIDEO_DIR")
            TARGET="$FORGE_ROOT/BANK_D_CLIPS/$VIDEO_NAME"
            mkdir -p "$TARGET"
            if [ -d "$VIDEO_DIR/clips" ]; then
              cp "$VIDEO_DIR/clips/"*.mp4 "$TARGET/" 2>/dev/null || true
            fi
          done
          
          echo "Distribution terminée"
          echo "=== Contenu des banques ==="
          find $FORGE_ROOT/BANK_* -type f -not -name ".gitkeep" | wc -l
          echo "fichiers dans les banques"
          echo ""
          echo "=== Sous-dossiers par vidéo ==="
          find $FORGE_ROOT/BANK_B_NATURE/fire -mindepth 1 -maxdepth 1 -type d | while read d; do
            echo "  $(basename $d): $(find $d -type f | wc -l) fichiers"
          done

      # === STEP 5: INDEX ===
      - name: F00-5 INDEX — Update index.json
        run: |
          cd F00_ASSET_FORGE/CODEBASE
          python crs_f00_index.py --forge-root .. 2>&1 | tee /tmp/index_log.txt

      # === STEP 5b: CANVAS ===
      - name: F00-5b CANVAS — Create contact sheet for oracle vision
        run: |
          cd F00_ASSET_FORGE/CODEBASE
          python crs_f00_canvas.py --forge-root .. --output ../CANVAS 2>&1 | tee /tmp/canvas_log.txt
          
          # Lister les toiles générées
          echo "=== Toiles générées ==="
          find ../CANVAS -name "canvas_*.png" -type f -exec ls -lh {} \;
          
          # Afficher les prompts pour l'oracle
          echo ""
          echo "=== PROMPTS ORACLE ==="
          python crs_f00_canvas.py --forge-root .. --prompt-only 2>&1 | tail -50

      # === STEP 5c: VISION TAGGER (OpenRouter) ===
      - name: F00-5c VISION — OpenRouter Gemma 3 12B canvas analysis
        if: ${{ env.OPENROUTER_API_KEY != '' }}
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          cd F00_ASSET_FORGE/CODEBASE
          pip install openai pillow
          python crs_f00_vision_tagger.py \
            --forge-root .. \
            --output ../oracle_tags_vision.json \
            --index ../index.json \
            --tag-index ../tag_index.json 2>&1 | tee /tmp/vision_log.txt
          echo "VISION_DONE=true" >> $GITHUB_OUTPUT
        continue-on-error: true

      - name: F00-5c VISION — Skip (no OPENROUTER_API_KEY)
        if: ${{ env.OPENROUTER_API_KEY == '' }}
        run: |
          echo "⚠️ OPENROUTER_API_KEY non défini — étape vision tagger ignorée"
          echo "Ajoutez le secret OPENROUTER_API_KEY dans Settings > Secrets > Actions"
          echo "Obtenez une clé gratuite sur https://openrouter.ai/keys"

      # === STEP 6: COMMIT ===
      - name: F00-6 COMMIT — Push to f00-asset-forge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add F00_ASSET_FORGE/
          
          if git diff --cached --quiet; then
            echo "Aucun changement à committer"
          else
            COMMIT_MSG="f00: asset forge run — $(date -u '+%Y-%m-%d %H:%M') UTC"
            COMMIT_MSG+=" | mode=${{ inputs.mode }}"
            COMMIT_MSG+=" | urls=${{ inputs.video_urls }}"
            git commit -m "$COMMIT_MSG"
            git push
            echo "Commité et poussé: $COMMIT_MSG"
          fi

      # === RÉSUMÉ ===
      - name: Résumé du run
        run: |
          echo "=========================================="
          echo "  F00 ASSET FORGE — RÉSUMÉ DU RUN"
          echo "=========================================="
          echo ""
          echo "Mode: ${{ inputs.mode }}"
          echo "URLs: ${{ inputs.video_urls }}"
          echo ""
          echo "--- INGEST ---"
          cat /tmp/ingest_log.txt 2>/dev/null | tail -5 || echo "N/A"
          echo ""
          echo "--- EXTRACT ---"
          cat /tmp/extract_log.txt 2>/dev/null | tail -5 || echo "N/A"
          echo ""
          echo "--- PROCESS ---"
          cat /tmp/process_log.txt 2>/dev/null | tail -5 || echo "N/A"
          echo ""
          echo "--- INDEX ---"
          cat /tmp/index_log.txt 2>/dev/null || echo "N/A"
          echo ""
          echo "--- CANVAS ---"
          cat /tmp/canvas_log.txt 2>/dev/null | tail -10 || echo "N/A"
          echo ""
          echo "--- BANQUES ---"
          echo "BANK_A (characters): $(find F00_ASSET_FORGE/BANK_A_CHARACTERS -type f | wc -l) fichiers"
          echo "BANK_B (nature): $(find F00_ASSET_FORGE/BANK_B_NATURE -type f | wc -l) fichiers"
          echo "BANK_C (backgrounds): $(find F00_ASSET_FORGE/BANK_C_BACKGROUNDS -type f | wc -l) fichiers"
          echo "BANK_D (clips): $(find F00_ASSET_FORGE/BANK_D_CLIPS -type f | wc -l) fichiers"
          echo ""
          echo "=========================================="
