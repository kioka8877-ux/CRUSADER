name: F00 ASSETFORGE — Image Generation (CPU, parallel)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID du run CRUSADER (ex: CRS_20260708_0608)"
        required: true
      mode:
        description: "Mode de génération (TEST | FULL)"
        required: false
        default: "TEST"

permissions:
  contents: write

jobs:
  # === PREPARE: Download manifest, determine how many images to generate ===
  prepare:
    name: "Prepare manifest"
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      image_count: ${{ steps.build-matrix.outputs.image_count }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Download prompts_manifest.json from Release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ inputs.run_id }}
        run: |
          python3 -c "
          import requests, json, os
          token = os.environ.get('GH_TOKEN') or os.environ.get('GITHUB_TOKEN')
          run_id = os.environ['RUN_ID']
          repo = 'kioka8877-ux/CRUSADER'
          h = {'Authorization': f'token {token}', 'Accept': 'application/vnd.github+json'}
          r = requests.get(f'https://api.github.com/repos/{repo}/releases/tags/{run_id}', headers=h)
          if not r.ok:
              print(f'Release {run_id} not found: {r.status_code}')
              exit(1)
          assets = r.json().get('assets', [])
          manifest_asset = next((a for a in assets if a['name'] == 'prompts_manifest.json'), None)
          if not manifest_asset:
              print(f'prompts_manifest.json not found. Available: {[a[\"name\"] for a in assets]}')
              exit(1)
          r = requests.get(manifest_asset['url'], headers={**h, 'Accept': 'application/octet-stream'})
          with open('prompts_manifest.json', 'wb') as f:
              f.write(r.content)
          print(f'Downloaded prompts_manifest.json ({len(r.content)} bytes)')
          "

      - name: Prepare manifest and build matrix
        id: build-matrix
        run: |
          python3 -c "
          import json
          with open('prompts_manifest.json') as f:
              manifest = json.load(f)
          
          mode = '${{ inputs.mode }}'
          if mode == 'TEST':
              manifest['images'] = manifest['images'][:1]
              manifest['meta']['total_images'] = 1
          
          with open('prompts_manifest_prepared.json', 'w') as f:
              json.dump(manifest, f, indent=2)
          
          count = len(manifest['images'])
          indices = list(range(count))
          matrix = json.dumps({'index': indices})
          
          print(f'Images to generate: {count}')
          # Set outputs
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'matrix={matrix}\n')
              f.write(f'image_count={count}\n')
          "
        env:
          GITHUB_OUTPUT: ${{ github.env }}

      - name: Upload manifest as artifact
        uses: actions/upload-artifact@v4
        with:
          name: manifest
          path: prompts_manifest_prepared.json
          retention-days: 1

  # === GENERATE: One job per image, all in parallel ===
  generate:
    name: "Generate image ${{ matrix.index }}"
    needs: prepare
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Download manifest
        uses: actions/download-artifact@v4
        with:
          name: manifest
          path: .

      - name: Generate image
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Rename to expected filename
          mv prompts_manifest_prepared.json prompts_manifest.json 2>/dev/null || true
          
          python3 gamma/F00_ASSETFORGE/CODEBASE/crs_f00_generate.py \
            --manifest prompts_manifest.json \
            --index ${{ matrix.index }} \
            --output output/

      - name: Upload image artifact
        uses: actions/upload-artifact@v4
        with:
          name: image-${{ matrix.index }}
          path: output/
          retention-days: 1

  # === COLLECT: Gather all images and commit to repo ===
  collect:
    name: "Collect and commit images"
    needs: generate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          token: ${{ secrets.GH_TOKEN }}

      - name: Download all image artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: image-*
          merge-multiple: true
          path: all_images

      - name: Show all generated images
        run: |
          echo "=== Generated images ==="
          find all_images -name "*.png" -exec ls -lh {} \;
          echo "Total: $(find all_images -name '*.png' | wc -l) images"

      - name: Copy images to SHARED/IN/images/
        run: |
          mkdir -p gamma/SHARED/IN/images/
          COPIED=0
          for img in all_images/*.png; do
              if [ -f "$img" ]; then
                  cp "$img" gamma/SHARED/IN/images/
                  COPIED=$((COPIED + 1))
              fi
          done
          echo "Copied $COPIED images to gamma/SHARED/IN/images/"

          if [ $COPIED -eq 0 ]; then
              echo "⚠️ No images generated"
              exit 1
          fi

      - name: Commit images to repository
        env:
          RUN_ID: ${{ inputs.run_id }}
          MODE: ${{ inputs.mode }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          git add gamma/SHARED/IN/images/
          
          if git diff --cached --quiet; then
              echo "No changes to commit"
          else
              IMG_COUNT=$(find gamma/SHARED/IN/images/ -name "*.png" -newer gamma/SHARED/IN/images/.gitkeep 2>/dev/null | wc -l || echo "?")
              COMMIT_MSG="f00(assetforge): ${MODE} run — ${RUN_ID} — ${IMG_COUNT} images"
              git commit -m "$COMMIT_MSG"
              git push
              echo "✓ Committed and pushed: $COMMIT_MSG"
          fi

      - name: Summary
        run: |
          echo "=========================================="
          echo "  F00 ASSETFORGE — RÉSUMÉ DU RUN"
          echo "=========================================="
          echo ""
          echo "Run ID: ${{ inputs.run_id }}"
          echo "Mode:   ${{ inputs.mode }}"
          echo ""
          IMG_COUNT=$(find all_images -name "*.png" 2>/dev/null | wc -l || echo "0")
          echo "Images générées: ${IMG_COUNT}"
          echo ""
          echo "=========================================="
