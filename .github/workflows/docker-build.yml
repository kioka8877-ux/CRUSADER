name: Build Docker Image — CRUSADER F03

on:
  # Déclencher manuellement depuis GitHub Actions
  workflow_dispatch:
  # Rebuild automatique si Dockerfile ou ses dépendances changent
  push:
    branches: [main]
    paths:
      - "alpha/F03_SIGISMUND/CODEBASE/Dockerfile"
      - "alpha/F03_SIGISMUND/CODEBASE/docker-fonts-dl.js"
      - "alpha/F03_SIGISMUND/CODEBASE/package.json"
      - "alpha/F03_SIGISMUND/CODEBASE/package-lock.json"

jobs:
  build-and-push:
    name: Build & Push ghcr.io
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      packages: write   # Requis pour push vers ghcr.io

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & Push image
        uses: docker/build-push-action@v5
        with:
          context: alpha/F03_SIGISMUND/CODEBASE
          file: alpha/F03_SIGISMUND/CODEBASE/Dockerfile
          push: true
          tags: |
            ghcr.io/kioka8877-ux/crusader-remotion:latest
            ghcr.io/kioka8877-ux/crusader-remotion:${{ github.sha }}
          # Cache BuildKit → rebuilds ultra-rapides si seul le code source change
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image size report
        run: |
          docker pull ghcr.io/kioka8877-ux/crusader-remotion:latest
          docker image inspect ghcr.io/kioka8877-ux/crusader-remotion:latest \
            --format '{{.Size}}' | \
            awk '{printf "[IMAGE] Taille : %.0f MB\n", $1/1024/1024}'
